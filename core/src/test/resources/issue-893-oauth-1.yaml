openapi: 3.1.0
info:
  title: Company API
  version: V0
paths:
  /users:
    post:
      operationId: createUser
      responses:
        '201':
          description: Created
      security:
        - OAuth2: []
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: OK
      security:
        - OAuth2: [read]
          OldApiKey: []
        - BasicAuth: []
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: ''
          tokenUrl: ''
          scopes:
            read: Read access
    OldApiKey:
      type: apiKey
      in: header
      name: X-Old-Key
    BasicAuth:
      type: http
      scheme: basic
