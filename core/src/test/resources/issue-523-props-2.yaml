openapi: 3.0.1
info:
  title: issue 523 properties
  version: "1.0"
paths:
  /check/API:
    get:
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpAPIRO"
components:
  schemas:
    ExpAPIRO:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ExpAPIDataRO"
    ExpAPIDataRO:
      type: object
      properties:
        relationships:
          $ref: "#/components/schemas/ExpAPIRelationshipsRO"
    ExpAPIRelationshipsRO:
      type: object
      properties:
        linkedTpes:
          $ref: "#/components/schemas/OneToManyRelationshipRO"
        shelfNetworkConstruct:
          $ref: "#/components/schemas/OneToOneRelationshipRO"
    OneToManyRelationshipRO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RelationshipDataRO"
        meta:
          $ref: "#/components/schemas/RelationshipMetaDataRO"
    RelationshipDataRO:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/RelationshipAttributesRO"
    RelationshipAttributesRO:
      type: object
      properties:
        additionalAttributes:
          $ref: "#/components/schemas/AdditionalAttributesRO"
    AdditionalAttributesRO:
      type: object
    RelationshipMetaDataRO:
      type: object
      properties:
        partiallyPopulated:
          type: boolean
    OneToOneRelationshipRO:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/RelationshipDataRO"
        meta:
          $ref: "#/components/schemas/RelationshipMetaDataRO"
