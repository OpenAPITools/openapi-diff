openapi: 3.0.0
info:
  title: Issue 802 API
  version: V1
paths:
  /info:
    get:
      operationId: getInfo
      responses:
        '200':
          description: OK
      security:
        - PAT: []
        - petstore_auth:
            - read
components:
  securitySchemes:
    PAT:
      type: apiKey
      name: Authorization
      in: header
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://example.com/api/oauth/dialog
          scopes:
            read: Read access to the info
