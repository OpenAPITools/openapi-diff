openapi: 3.0.1
info:
  title: cyclic composed schema test
  version: '1.0'
servers:
  - url: 'http://localhost:8000/'
paths:
  /ping:
    get:
      operationId: ping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Entry'
components:
  schemas:
    Entry:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        child:
          title: Child
          allOf:
            - $ref: '#/components/schemas/Child'
    Child:
      type: object
      properties:
        name:
          type: integer
        parent:
          title: Parent
          allOf:
            - $ref: '#/components/schemas/Entry'
