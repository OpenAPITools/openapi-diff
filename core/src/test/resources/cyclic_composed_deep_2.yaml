    Level3:
      type: object
      properties:
        tag:
          type: string
        next:
          title: Level4
          allOf:
            - $ref: '#/components/schemas/Level4'
    Level4:
      type: object
      properties:
        tag:
          type: string
        next:
          title: Level5
          allOf:
            - $ref: '#/components/schemas/Level5'
    Level5:
      type: object
      properties:
        tag:
          type: string
        next:
          title: Level6
          allOf:
            - $ref: '#/components/schemas/Level6'
    Level6:
      type: object
      properties:
        tag:
          type: string
        next:
          title: Level7
          allOf:
            - $ref: '#/components/schemas/Level7'
    Level7:
      type: object
      properties:
        tag:
